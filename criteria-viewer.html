<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIGEM · Visualizador de Critérios</title><style>body{margin:0;background:#e9eef5;color:#15334b;font:14px Arial,sans-serif}header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#0b304b;color:white;padding:12px 16px;position:sticky;top:0;z-index:5}header strong{margin-right:auto;max-width:38vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}input{padding:9px;border:1px solid #9bb3c8;border-radius:5px;min-width:180px}button{padding:9px 12px;background:#fff;color:#0b304b;border:1px solid #9bb3c8;border-radius:5px;cursor:pointer}button:disabled{opacity:.5}#status{padding:9px 16px;background:#fff;border-bottom:1px solid #cad5df}main{display:flex;justify-content:center;padding:22px;overflow:auto}.page{position:relative;box-shadow:0 4px 24px #9aa9b8;background:white}.page canvas{display:block;max-width:none}.mark{position:absolute;background:rgba(255,213,0,.48);pointer-events:none}.mark.current{background:rgba(255,128,0,.72)}@media(max-width:700px){header strong{max-width:100%;width:100%}main{padding:8px}}</style></head><body><header><strong id="filename">Critério de medição</strong><label for="search">Pesquisar:</label><input id="search" type="search" placeholder="Digite um termo específico" aria-label="Pesquisar texto no PDF"><button id="find">Buscar</button><button id="prev-match" disabled>◀ Resultado</button><span id="matches">0 resultados</span><button id="next-match" disabled>Resultado ▶</button><button id="prev-page">◀ Página</button><span id="page-label">—</span><button id="next-page">Página ▶</button></header><div id="status" role="status">Carregando documento...</div><main><div id="page" class="page"><canvas id="canvas"></canvas><div id="highlights"></div></div></main><script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script><script src="criteria-viewer.js?v=20261024-blobfix2"></script></body></html>
